name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pr-source:
    name: PR branch belongs to target repository
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Reject cross-repository PRs
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$SOURCE_REPOSITORY" != "$TARGET_REPOSITORY" ]; then
            echo "::error::PRs must originate from a branch in their target repository."
            exit 1
          fi

  site:
    name: Site (typecheck + lint)
    # Keep the browser runner on an OS supported by the pinned Playwright 1.56.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check Zwift event links
        run: npm run check:zwift-links
      - run: npm ci
      # Production dependencies only. braces has no patched release and is pulled in by the
      # ESLint toolchain, so a full audit would stay red after the runtime fixes.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint site
        run: npm run lint
      # apps/** is excluded from next lint (it is a React config, wrong for a CommonJS bot), so
      # the bot had no static checking at all. no-undef alone already caught a real bug: a
      # variable declared inside a try and read from its catch, which made every errored coach
      # turn throw from its own error handler.
      - name: Lint bot
        run: npm run lint:bot
      # Shared modules the bot does not get a synced copy of — only the website uses them, so the
      # bot job's services/**/*.test.js glob would never see them and they would ship untested.
      - name: Shared unit tests
        run: npm test
      - name: Streaming installer and proxy unit tests
        run: npm run test:streaming-setup
      - name: Install browser test tooling
        run: npm ci --prefix scripts/architecture
      - name: Install Chromium
        run: node scripts/architecture/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Streaming wizard browser regression (isolated Next.js site)
        timeout-minutes: 10
        run: npm run test:streaming-setup:browser

  bot:
    name: Bot (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/bot/.nvmrc
      # Adapter tests import the OpenAI SDK, so dependencies must be present. Disable lifecycle
      # scripts to avoid compiling the native canvas dependency; no bot test needs its binary.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install OBS Lua transport test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y luajit libcurl4
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Unit tests
        run: npm test
      # Structure-only pass over the coach prompt: no API calls, no cost. The full golden set
      # (npm run eval) needs an OpenAI key and is deliberately not in CI — model output is not
      # perfectly deterministic, and a flaky required check is one people learn to ignore.
      - name: Coach prompt structure
        run: npm run eval:dry

  shared-sync:
    name: Shared copies are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # packages/shared is the source of truth, but Render and Cloud Run build apps/* as their
      # own project root and cannot resolve require("../../packages/..."), so copies live in the
      # app trees. render.yaml's buildFilter only triggers on apps/bot/**, so editing a shared
      # source alone does not even rebuild the bot — the drift would be silent without this.
      - name: Check shared copies
        run: node scripts/sync-shared.js --check

  obs-native:
    name: Native OBS smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    env:
      OBS_VERSION: 31.1.2
      OBS_SMOKE_ARTIFACTS: ${{ github.workspace }}/.obs-native-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Prepare native OBS diagnostics
        run: |
          node -e "const fs = require('node:fs'); const path = require('node:path'); fs.mkdirSync(process.env.OBS_SMOKE_ARTIFACTS, { recursive: true }); fs.writeFileSync(path.join(process.env.OBS_SMOKE_ARTIFACTS, 'runner.json'), JSON.stringify({ platform: process.platform, arch: process.arch, node: process.version, obsVersion: process.env.OBS_VERSION }, null, 2))"
      - name: Install isolated callback fixture dependencies
        run: npm ci --prefix apps/bot --ignore-scripts
      - name: Install official OBS Studio (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'obs-native'
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          $archive = Join-Path $installDir 'obs.zip'
          $asset = "OBS-Studio-$env:OBS_VERSION-Windows-x64.zip"
          Invoke-WebRequest -Uri "https://github.com/obsproject/obs-studio/releases/download/$env:OBS_VERSION/$asset" -OutFile $archive
          $expected = '9513cd402936593a6a5500da5d2bd49e6cd04dce05509c7b7f48dd25c391d2d8'
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "OBS archive checksum mismatch: $actual" }
          Expand-Archive -Path $archive -DestinationPath $installDir
          $executable = Join-Path $installDir 'bin/64bit/obs64.exe'
          if (!(Test-Path $executable)) { throw "OBS executable missing: $executable" }
          "OBS_EXECUTABLE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          @{ version = $env:OBS_VERSION; asset = $asset; sha256 = $actual; executable = $executable } |
            ConvertTo-Json | Set-Content -Path (Join-Path $env:OBS_SMOKE_ARTIFACTS 'installation.json')
      - name: Install official OBS Studio (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/obs-native"
          mkdir -p "$install_dir/mount"
          case "$(uname -m)" in
            arm64)
              architecture=Apple
              expected=8f18142c8599d4e80baee5913b03f8357c3e5fd0b76835f54e76dedf9f857188
              ;;
            x86_64)
              architecture=Intel
              expected=8eff8f85f6b72a476c9074b00840326a2888f208f3c3c70aed1bedacd692935f
              ;;
            *) exit 1 ;;
          esac
          asset="OBS-Studio-$OBS_VERSION-macOS-$architecture.dmg"
          curl --fail --location --retry 3 "https://github.com/obsproject/obs-studio/releases/download/$OBS_VERSION/$asset" --output "$install_dir/obs.dmg"
          actual=$(shasum -a 256 "$install_dir/obs.dmg" | cut -d ' ' -f 1)
          test "$actual" = "$expected"
          hdiutil attach "$install_dir/obs.dmg" -nobrowse -readonly -mountpoint "$install_dir/mount"
          trap 'hdiutil detach "$install_dir/mount" || true' EXIT
          ditto "$install_dir/mount/OBS.app" "$install_dir/OBS.app"
          test -x "$install_dir/OBS.app/Contents/MacOS/OBS"
          printf 'OBS_EXECUTABLE=%s\n' "$install_dir/OBS.app/Contents/MacOS/OBS" >> "$GITHUB_ENV"
          printf 'version=%s\nasset=%s\nsha256=%s\n' "$OBS_VERSION" "$asset" "$actual" > "$OBS_SMOKE_ARTIFACTS/installation.txt"
      - name: Exercise shipped Lua in native OBS with isolated HTTPS callback
        run: node scripts/obs-native-smoke.mjs
      - name: Upload native OBS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obs-native-${{ matrix.os }}
          path: ${{ env.OBS_SMOKE_ARTIFACTS }}
          if-no-files-found: warn
          include-hidden-files: true
